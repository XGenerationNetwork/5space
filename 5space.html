<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>5Space &mdash; a SubSpace roguelike</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060a'/%3E%3Cpath d='M16 4 L26 27 L16 21 L6 27 Z' fill='%2340c0f0'/%3E%3C/svg%3E">
<style>
/* 5Space - the canvas fills the window; everything else floats over it. */

:root {
  --ink: #cfe4ff;
  --dim: #7f96b0;
  --accent: #40c0f0;
  --gold: #ffd24a;
  --panel: rgba(8, 12, 20, 0.88);
  --edge: rgba(90, 140, 190, 0.35);
  --mono: "DejaVu Sans Mono", "Liberation Mono", Menlo, Consolas, "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #05060a;
  color: var(--ink);
  font-family: var(--mono);
  -webkit-font-smoothing: antialiased;

  /* A game surface, not a document: no pinch-zoom, no pull-to-refresh, no
     text selection or callout menus when a thumb rests on a control. */
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

#screen {
  display: block;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.hidden { display: none !important; }

/* ---- message log ---------------------------------------------------- */

#messages {
  position: fixed;
  top: 10px;
  left: 12px;
  max-width: min(52ch, 60vw);
  pointer-events: none;
  font-size: 13px;
  line-height: 1.45;
  text-shadow: 0 1px 3px #000, 0 0 8px #000;
}

#messages .msg {
  color: var(--ink);
  transition: opacity 0.2s linear;
}

/* ---- the big banner ------------------------------------------------- */

#banner {
  position: fixed;
  top: 32%;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(22px, 5vw, 46px);
  font-weight: bold;
  letter-spacing: 0.08em;
  pointer-events: none;
  text-shadow: 0 2px 16px #000, 0 0 40px rgba(0, 0, 0, 0.9);
  opacity: 0;
}

#banner.fade { animation: bannerFade 2.4s ease-out forwards; }

@keyframes bannerFade {
  0% { opacity: 0; transform: scale(1.12); }
  12% { opacity: 1; transform: scale(1); }
  70% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.04); }
}

/* ---- overlays: menus, prompts, full-screen text ---------------------- */

#overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(3, 5, 10, 0.82);
  backdrop-filter: blur(2px);
  z-index: 20;
  padding: 20px;
}

.menu {
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: 4px;
  padding: 18px 22px;
  max-width: min(96ch, 96vw);
  max-height: 92vh;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.5;
  box-shadow: 0 12px 60px rgba(0, 0, 0, 0.8);
}

.menu.full { min-width: min(88ch, 92vw); }

.mtitle {
  display: block;
  color: var(--gold);
  font-weight: bold;
  margin-bottom: 10px;
  letter-spacing: 0.04em;
}

.mhead {
  color: var(--accent);
  margin: 12px 0 4px;
  font-weight: bold;
}

.mrow {
  white-space: pre-wrap;
  color: var(--ink);
  padding: 1px 0;
}

.mrow.pick {
  cursor: pointer;
  padding: 3px 6px;
  margin: 1px -6px;
  border-radius: 3px;
}

.mrow.pick:hover { background: rgba(64, 192, 240, 0.14); }

.msel {
  display: inline-block;
  min-width: 2.4ch;
  color: var(--gold);
  font-weight: bold;
}

.mfoot {
  display: block;
  margin-top: 12px;
  color: var(--dim);
  font-size: 12px;
}

.logo { color: #56d0ff; white-space: pre; }
.hi { color: var(--gold); }

/* ---- text entry ------------------------------------------------------ */

.entryform { margin: 6px 0 2px; }

/* Big enough to be an obvious tap target: if a browser declines to focus it
   automatically, tapping it is the fallback that always works. */
.entryinput {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  background: rgba(4, 8, 14, 0.9);
  border: 1px solid var(--accent);
  border-radius: 5px;
  color: #fff;
  font-family: var(--mono);
  font-size: 17px;              /* under 16px and iOS zooms the page in */
  letter-spacing: 0.04em;
  outline: none;
  /* the page suppresses selection; a text field needs it back */
  user-select: text;
  -webkit-user-select: text;
  touch-action: manipulation;
}

.entryinput:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(255, 210, 74, 0.2); }

.entrybtns { display: flex; gap: 10px; margin-top: 12px; }

.ebtn {
  flex: 1;
  padding: 12px 18px;
  background: rgba(20, 32, 48, 0.9);
  border: 1px solid var(--edge);
  border-radius: 5px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

.ebtn.ok { background: var(--accent); border-color: var(--accent); color: #04121c; }
.ebtn:active { transform: scale(0.98); }
.ebtn.ok:active { background: var(--gold); }

.entry { color: #fff; }
.caret { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* ---- the hull picker ------------------------------------------------- */

.shipname { font-weight: bold; }
.shipstats { color: var(--dim); font-size: 12px; }
.shipblurb { color: var(--ink); font-size: 12.5px; padding: 2px 0 0 2.4ch; opacity: 0.9; }
.shiphint { color: var(--dim); font-size: 12px; padding: 0 0 4px 2.4ch; font-style: italic; }

/* ---- on-screen controls ---------------------------------------------- */

/* The layer covers the screen but only its buttons take input, so a thumb
   that misses one lands on the game rather than on an invisible panel. */
#touch {
  position: fixed;
  inset: 0;
  z-index: 15;
  pointer-events: none;
}

/* A menu owns the whole screen; the flight controls step aside for it. */
#overlay:not(.hidden) ~ #touch { display: none; }

#touch .tbtn {
  pointer-events: auto;
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16, 26, 40, 0.5);
  border: 1px solid rgba(120, 175, 225, 0.34);
  border-radius: 12px;
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.04em;
  touch-action: none;
  backdrop-filter: blur(2px);
  transition: background 0.06s linear, transform 0.06s linear;
}

#touch .tbtn.lit,
#touch .tbtn:active {
  background: rgba(64, 192, 240, 0.42);
  border-color: rgba(150, 220, 255, 0.8);
  transform: scale(0.96);
}

/* thumb zones: bottom corners, inside the safe area */
#touch .tpad {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  width: 186px;
  height: 186px;
  pointer-events: none;
}
#touch .tpad-left { left: calc(env(safe-area-inset-left, 0px) + 10px); }
#touch .tpad-right { right: calc(env(safe-area-inset-right, 0px) + 10px); }

/* a d-pad: thrust above, reverse below, turn either side */
#touch .tpad-left .tbtn { width: 62px; height: 62px; font-size: 20px; }
#touch .tpad-left .up { left: 62px; top: 0; }
#touch .tpad-left .left { left: 0; top: 62px; }
#touch .tpad-left .right { left: 124px; top: 62px; }
#touch .tpad-left .down { left: 62px; top: 124px; }

/* fire under the thumb, bomb and boost within reach of it */
#touch .tpad-right .fire {
  right: 0; bottom: 8px;
  width: 104px; height: 104px;
  border-radius: 52px;
  font-size: 17px;
  background: rgba(64, 150, 200, 0.34);
}
#touch .tpad-right .bomb { right: 8px; bottom: 118px; width: 86px; height: 52px; }
#touch .tpad-right .boost { right: 112px; bottom: 20px; width: 68px; height: 68px; border-radius: 34px; }

/* Map, gear and menu stack down the right-hand edge, below the radar.
   Anywhere along the top centre they eventually collide with the status
   readout on the left - which is exactly what happened on a tablet, where
   the readout is wide enough to reach the middle.  The radar is 22vmin tall
   (capped at 190px) and starts 12px down, hence the offset. */
#touch .ttop {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + min(22vmin, 190px) + 22px);
  right: calc(env(safe-area-inset-right, 0px) + 10px);
  display: flex;
  flex-direction: column;
  gap: 6px;
  pointer-events: none;
}
#touch .ttop .tbtn {
  position: static;
  min-width: 56px;
  height: 34px;
  font-size: 12px;
  border-radius: 8px;
}

/* everything else, behind one toggle, opening inward from that column */
#touch .tgear-panel {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + min(22vmin, 190px) + 22px);
  right: calc(env(safe-area-inset-right, 0px) + 72px);
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 10px;
  width: min(420px, calc(100vw - 96px));
  background: rgba(8, 12, 20, 0.9);
  border: 1px solid var(--edge);
  border-radius: 10px;
  pointer-events: auto;
}
#touch .tgear-panel .tbtn {
  position: static;
  height: 40px;
  font-size: 11px;
  font-weight: normal;
  border-radius: 7px;
}

/* compact: small phones, where the pads would otherwise meet in the middle */
#touch.compact .tpad { width: 150px; height: 150px; }
#touch.compact .tpad-left .tbtn { width: 50px; height: 50px; font-size: 17px; }
#touch.compact .tpad-left .up { left: 50px; top: 0; }
#touch.compact .tpad-left .left { left: 0; top: 50px; }
#touch.compact .tpad-left .right { left: 100px; top: 50px; }
#touch.compact .tpad-left .down { left: 50px; top: 100px; }
#touch.compact .tpad-right .fire { width: 86px; height: 86px; border-radius: 43px; font-size: 14px; }
#touch.compact .tpad-right .bomb { bottom: 100px; width: 74px; height: 44px; font-size: 11px; }
#touch.compact .tpad-right .boost { right: 92px; bottom: 16px; width: 58px; height: 58px; border-radius: 29px; font-size: 11px; }

#touch.compact .ttop .tbtn { min-width: 52px; height: 30px; font-size: 11px; }
#touch.compact .tgear-panel {
  grid-template-columns: repeat(3, 1fr);
  width: min(300px, calc(100vw - 96px));
}

/* the message log clears the compact status readout when controls are up */
body.touch #messages {
  top: calc(env(safe-area-inset-top, 0px) + 52px);
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  max-width: 54vw;
  font-size: 11px;
}

body.touch #banner { top: 26%; }

/* menus must clear the thumb zones and the notch */
body.touch #overlay {
  padding: calc(env(safe-area-inset-top, 0px) + 12px)
           calc(env(safe-area-inset-right, 0px) + 12px)
           calc(env(safe-area-inset-bottom, 0px) + 12px)
           calc(env(safe-area-inset-left, 0px) + 12px);
}
body.touch .menu { max-height: 86vh; }
body.touch .mrow.pick { padding: 9px 8px; }   /* tappable rows */

@media (max-width: 700px) {
  #messages { font-size: 11px; max-width: 70vw; }
  .menu { font-size: 12px; padding: 12px 14px; }
  .mrow.pick { padding: 8px 6px; }
}

</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="messages"></div>
<div id="banner" class="hidden"></div>
<div id="overlay" class="hidden"></div>
<div id="touch" class="hidden"></div>

<script>
/* ===== js/rng.js ===== */
/* 5Space - random number generation, vector maths, and small shared utilities.
 *
 * The RNG is a seeded xoshiro128** so that a saved game restores with an
 * identical random stream: the four state words go straight into the save
 * file.  All *world* randomness must go through here, never through
 * Math.random - but note that unlike a turn-based roguelike a real-time
 * simulation is not reproducible from a seed alone, because the player's
 * inputs arrive at wall-clock times.  The seed reproduces the *universe*
 * (sector layouts, enemy rosters, prize contents); it does not replay a
 * session.  Purely cosmetic randomness - explosion sparks, the starfield -
 * deliberately uses Math.random, so that drawing a frame never perturbs the
 * stream that the simulation depends on.
 */
(function (SS) {
  'use strict';

  function RNG(seed) {
    this.seed(seed === undefined ? (Date.now() ^ (Math.random() * 0x100000000)) : seed);
  }

  RNG.prototype.seed = function (s) {
    s = s >>> 0;
    if (s === 0) s = 0x9e3779b9;
    /* splitmix32 to spread a single seed word over the four state words */
    var x = s;
    function nxt() {
      x = (x + 0x9e3779b9) >>> 0;
      var z = x;
      z = Math.imul(z ^ (z >>> 16), 0x21f0aaad) >>> 0;
      z = Math.imul(z ^ (z >>> 15), 0x735a2d97) >>> 0;
      return (z ^ (z >>> 15)) >>> 0;
    }
    this.s0 = nxt(); this.s1 = nxt(); this.s2 = nxt(); this.s3 = nxt();
    this.initialSeed = s;
    for (var i = 0; i < 12; i++) this.u32();
  };

  /* raw 32-bit unsigned draw (xoshiro128**) */
  RNG.prototype.u32 = function () {
    var s0 = this.s0, s1 = this.s1, s2 = this.s2, s3 = this.s3;
    var result = (Math.imul(Math.imul(s1, 5) >>> 0, 9) >>> 0);
    result = ((result << 7) | (result >>> 25)) >>> 0;
    result = Math.imul(result, 9) >>> 0;
    var t = (s1 << 9) >>> 0;
    s2 = (s2 ^ s0) >>> 0;
    s3 = (s3 ^ s1) >>> 0;
    s1 = (s1 ^ s2) >>> 0;
    s0 = (s0 ^ s3) >>> 0;
    s2 = (s2 ^ t) >>> 0;
    s3 = ((s3 << 11) | (s3 >>> 21)) >>> 0;
    this.s0 = s0; this.s1 = s1; this.s2 = s2; this.s3 = s3;
    return result;
  };

  /* uniform float in [0,1) */
  RNG.prototype.float = function () {
    return this.u32() / 4294967296;
  };

  RNG.prototype.getState = function () {
    return [this.s0, this.s1, this.s2, this.s3, this.initialSeed];
  };

  RNG.prototype.setState = function (st) {
    this.s0 = st[0] >>> 0; this.s1 = st[1] >>> 0;
    this.s2 = st[2] >>> 0; this.s3 = st[3] >>> 0;
    this.initialSeed = st[4] >>> 0;
  };

  SS.RNG = RNG;
  SS.rng = new RNG();

  /* ---- dice helpers ---------------------------------------------------- */

  /* The helpers coerce their arguments to non-negative integers; a fractional
     die count would otherwise make d()'s countdown loop forever, since `n--`
     never lands exactly on zero. */

  /* 0 .. n-1 */
  SS.rn2 = function (n) {
    n = Math.floor(n);
    if (!(n > 1)) return 0;
    return SS.rng.u32() % n;
  };

  /* 1 .. n */
  SS.rnd = function (n) {
    n = Math.floor(n);
    if (!(n > 1)) return 1;
    return (SS.rng.u32() % n) + 1;
  };

  /* n dice of x sides */
  SS.d = function (n, x) {
    n = Math.floor(n);
    if (!(n > 0)) return 0;
    var tmp = n;
    while (n--) tmp += SS.rn2(x);
    return tmp;
  };

  /* rn2(x) + y */
  SS.rn1 = function (x, y) { return SS.rn2(x) + y; };

  /* uniform float in [lo, hi) */
  SS.rnf = function (lo, hi) { return lo + SS.rng.float() * (hi - lo); };

  /* usually 1, occasionally larger - used for prize stacking */
  SS.rne = function (x, cap) {
    var n = 1;
    cap = cap || 5;
    while (n < cap && !SS.rn2(x)) n++;
    return n;
  };

  /* random element of an array */
  SS.pick = function (arr) {
    if (!arr || !arr.length) return null;
    return arr[SS.rn2(arr.length)];
  };

  /* in-place Fisher-Yates using the game RNG */
  SS.shuffle = function (arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = SS.rn2(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  };

  /* pick from a list, weighted by weightOf(entry) (default entry.weight) */
  SS.pickWeighted = function (list, weightOf) {
    var total = 0, i;
    for (i = 0; i < list.length; i++) total += weightOf ? weightOf(list[i]) : list[i].weight;
    if (total <= 0) return null;
    var r = SS.rn2(total);
    for (i = 0; i < list.length; i++) {
      r -= weightOf ? weightOf(list[i]) : list[i].weight;
      if (r < 0) return list[i];
    }
    return list[list.length - 1];
  };

  /* ---- scalar helpers -------------------------------------------------- */

  SS.clamp = function (v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); };
  SS.sgn = function (v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); };
  SS.lerp = function (a, b, t) { return a + (b - a) * t; };

  SS.capitalize = function (s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1);
  };

  SS.anArticle = function (s) {
    if (!s) return s;
    return ('aeiou'.indexOf(s.charAt(0).toLowerCase()) >= 0 ? 'an ' : 'a ') + s;
  };

  SS.plural = function (n, singular, pluralForm) {
    return n === 1 ? singular : (pluralForm || (singular + 's'));
  };

  SS.commify = function (n) {
    return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  };

  /* m:ss for the play clock */
  SS.clockString = function (seconds) {
    seconds = Math.max(0, Math.floor(seconds));
    var m = Math.floor(seconds / 60), s = seconds % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  };

  /* ---- vector maths ---------------------------------------------------- */
  /* Positions and velocities are plain {x,y} objects in *tile* units.  One
     tile is 16 pixels, matching Continuum, and every setting quoted in pixels
     is divided by 16 on the way in. */

  SS.vec = function (x, y) { return { x: x || 0, y: y || 0 }; };

  SS.length2 = function (dx, dy) { return dx * dx + dy * dy; };

  SS.length = function (dx, dy) { return Math.sqrt(dx * dx + dy * dy); };

  SS.dist = function (a, b) { return SS.length(a.x - b.x, a.y - b.y); };

  SS.dist2 = function (a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return dx * dx + dy * dy;
  };

  /* Clamp a body's velocity to a maximum magnitude, the way ShipController
     truncates to the ship's top speed every tick.

     This takes the whole body and names the velocity fields explicitly rather
     than taking a bare {x,y}: a ship carries position *and* velocity, and a
     generic vector helper handed the wrong pair of fields silently scales the
     ship's coordinates instead of its speed. */
  SS.truncateVelocity = function (body, max) {
    var len2 = body.vx * body.vx + body.vy * body.vy;
    if (len2 > max * max && len2 > 0) {
      var s = max / Math.sqrt(len2);
      body.vx *= s; body.vy *= s;
    }
    return body;
  };

  /* ---- headings -------------------------------------------------------- */
  /* Continuum stores orientation as a float in [0,1) and draws it as one of 40
     discrete rotations.  Zero points straight up and the sequence runs
     clockwise.  Weapons fire along the *discrete* heading, which is why aim at
     close range feels faintly quantised - that is faithful, not a bug. */

  var ROTATIONS = 40;
  SS.ROTATIONS = ROTATIONS;

  /* wrap an orientation into [0,1) */
  SS.wrapOrient = function (o) {
    o = o % 1;
    return o < 0 ? o + 1 : o;
  };

  /* orientation float -> discrete rotation index 0..39 */
  SS.orientToRotation = function (o) {
    return Math.floor(SS.wrapOrient(o) * ROTATIONS) % ROTATIONS;
  };

  var HEADINGS = [];
  for (var r = 0; r < ROTATIONS; r++) {
    var ang = (r / ROTATIONS) * Math.PI * 2;
    /* zero = up = (0,-1), increasing clockwise in screen coordinates */
    HEADINGS.push({ x: Math.sin(ang), y: -Math.cos(ang) });
  }
  SS.HEADINGS = HEADINGS;

  /* unit heading vector for a discrete rotation */
  SS.rotationToHeading = function (rot) {
    return HEADINGS[((rot % ROTATIONS) + ROTATIONS) % ROTATIONS];
  };

  /* unit heading for an orientation float, quantised the way the original
     quantises before it fires */
  SS.orientToHeading = function (o) {
    return HEADINGS[SS.orientToRotation(o)];
  };

  /* orientation float for a direction vector */
  SS.headingToOrient = function (dx, dy) {
    return SS.wrapOrient(Math.atan2(dx, -dy) / (Math.PI * 2));
  };

  /* signed shortest turn from orientation a to orientation b, in [-0.5, 0.5) */
  SS.orientDelta = function (a, b) {
    var d = SS.wrapOrient(b - a);
    return d > 0.5 ? d - 1 : d;
  };

  /* The orientation that *fires* closest to a wanted bearing.

     Because orientToRotation floors, an orientation anywhere in a bucket
     shoots along that bucket's lower edge.  Aiming at the bearing itself can
     therefore land you in the bucket below it and throw the shot a full
     rotation point wide.  Snapping to the middle of the nearest bucket puts
     the fired heading as close to the bearing as forty headings allow, which
     is at worst half a rotation point - 4.5 degrees. */
  SS.snapOrient = function (o) {
    var r = Math.round(SS.wrapOrient(o) * ROTATIONS) % ROTATIONS;
    return (r + 0.5) / ROTATIONS;
  };

  /* The heading a ship at this orientation will actually shoot along,
     expressed back as an orientation - i.e. what the gun sees, not what the
     pilot intended. */
  SS.firedOrient = function (o) {
    return SS.orientToRotation(o) / ROTATIONS;
  };

  /* ---- byte packing, used to keep saved sectors small ------------------- */

  SS.packBytes = function (u8) {
    var CHUNK = 0x8000, out = '';
    for (var i = 0; i < u8.length; i += CHUNK) {
      out += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
    }
    return btoa(out);
  };

    return sec;
  };

  /* ---- the frame ------------------------------------------------------ */

  function borderRock(sec) {
    var w = 3;
    for (var x = 0; x < SIZE; x++) {
      for (var d = 0; d < w; d++) {
        sec.setTile(x, d, T.ROCK);
        sec.setTile(x, SIZE - 1 - d, T.ROCK);
      }
    }
    for (var y = 0; y < SIZE; y++) {
      for (var e = 0; e < w; e++) {
        sec.setTile(e, y, T.ROCK);
        sec.setTile(SIZE - 1 - e, y, T.ROCK);
      }
    }
  }

  /* ---- asteroid fields ------------------------------------------------ */

  /* Clusters of noise smoothed by a couple of cellular-automata passes.  The
     result reads as drifting rock rather than as a maze, which is what a
     SubSpace map looks like and what keeps flight lanes open. */
  function scatterAsteroids(sec, t) {
    var fields = 6 + Math.round(t * 10);
    for (var f = 0; f < fields; f++) {
      var cx = SS.rn1(SIZE - 40, 20);
      var cy = SS.rn1(SIZE - 40, 20);
      var rx = SS.rn1(22, 10);
      var ry = SS.rn1(22, 10);
      var fill = 0.36 + SS.rng.float() * 0.16 + t * 0.08;
      carveField(sec, cx, cy, rx, ry, fill);
    }
    /* a few lone rocks to break up the empty lanes */
    var singles = 60 + Math.round(t * 90);
    for (var s = 0; s < singles; s++) {
      var x = SS.rn1(SIZE - 20, 10), y = SS.rn1(SIZE - 20, 10);
      if (sec.tileAt(x, y) !== T.EMPTY) continue;
      var size = SS.rnd(3);
      for (var dy = 0; dy < size; dy++) {
        for (var dx = 0; dx < size; dx++) {
          if (sec.tileAt(x + dx, y + dy) === T.EMPTY) sec.setTile(x + dx, y + dy, T.ROCK);
        }
      }
    }
  }

  function carveField(sec, cx, cy, rx, ry, fill) {
    var w = rx * 2 + 1, h = ry * 2 + 1;
    var buf = new Uint8Array(w * h);
    var x, y, i;

    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        /* taper towards the edge of the ellipse so fields have soft borders */
        var nx = (x - rx) / rx, ny = (y - ry) / ry;
        var d = nx * nx + ny * ny;
        if (d > 1) continue;
        var p = fill * (1 - d * 0.65);
        if (SS.rng.float() < p) buf[y * w + x] = 1;
      }
    }

    for (var pass = 0; pass < 3; pass++) {
      var next = new Uint8Array(buf);
      for (y = 1; y < h - 1; y++) {
        for (x = 1; x < w - 1; x++) {
          var n = 0;
          for (var dy = -1; dy <= 1; dy++) {
            for (var dx = -1; dx <= 1; dx++) {
              if (!dx && !dy) continue;
              if (buf[(y + dy) * w + (x + dx)]) n++;
            }
          }
          i = y * w + x;
          next[i] = n >= 5 ? 1 : (n <= 2 ? 0 : buf[i]);
        }
      }
      buf = next;
    }

    for (y = 0; y < h; y++) {
      for (x = 0; x < w; x++) {
        if (!buf[y * w + x]) continue;
        var tx = cx - rx + x, ty = cy - ry + y;
        if (sec.tileAt(tx, ty) === T.EMPTY) sec.setTile(tx, ty, T.ROCK);
      }
    }
  }

  /* ---- bases ---------------------------------------------------------- */

  /* A base is a walled rectangle with internal partitions, at least two door
     entrances, and something worth flying in for.  Deeper bases are bigger
     and better subdivided, which is where the tight corridors - and the
     bouncing-bullet nightmares - come from. */
  function placeBase(sec, t, depth) {
    for (var attempt = 0; attempt < 40; attempt++) {
      var w = SS.rn1(18, 16) + Math.round(t * 12);
      var h = SS.rn1(14, 12) + Math.round(t * 10);
      var x0 = SS.rn1(SIZE - w - 24, 12);
      var y0 = SS.rn1(SIZE - h - 24, 12);
      if (!areaClearOfBases(sec, x0 - 6, y0 - 6, w + 12, h + 12)) continue;

      var base = { x: x0, y: y0, w: w, h: h, rooms: [] };

      /* clear the footprint of any rock, then wall the shell */
      var x, y;
      for (y = y0; y < y0 + h; y++) {
        for (x = x0; x < x0 + w; x++) sec.setTile(x, y, T.EMPTY);
      }
      for (x = x0; x < x0 + w; x++) {
        sec.setTile(x, y0, T.WALL);
        sec.setTile(x, y0 + h - 1, T.WALL);
      }
      for (y = y0; y < y0 + h; y++) {
        sec.setTile(x0, y, T.WALL);
        sec.setTile(x0 + w - 1, y, T.WALL);
      }

      partition(sec, x0 + 1, y0 + 1, w - 2, h - 2, 0, base, depth);
      punchEntrances(sec, base);
      connectRooms(sec, base);
      stockBase(sec, base, depth);

      sec.bases.push(base);
      return base;
    }
    return null;
  }

  function areaClearOfBases(sec, x, y, w, h) {
    if (x < 6 || y < 6 || x + w > SIZE - 6 || y + h > SIZE - 6) return false;
    for (var i = 0; i < sec.bases.length; i++) {
      var b = sec.bases[i];
      if (x < b.x + b.w && x + w > b.x && y < b.y + b.h && y + h > b.y) return false;
    }
    return true;
  }

  /* Recursive splits, the same idea as NetHack's rectangle partition, but the
     leaves become rooms inside a building instead of rooms in bedrock. */
  function partition(sec, x, y, w, h, level, base, depth) {
    var minRoom = 6;
    if (level >= 3 || w < minRoom * 2 + 1 || h < minRoom * 2 + 1) {
      base.rooms.push({ x: x, y: y, w: w, h: h });
      return;
    }
    var vertical = w > h ? true : (h > w ? false : SS.rn2(2) === 0);
    if (vertical) {
      var sx = x + SS.rn1(w - minRoom * 2, minRoom);
      for (var yy = y; yy < y + h; yy++) sec.setTile(sx, yy, T.WALL);
      cutOpening(sec, sx, y, sx, y + h - 1, true, depth);
      partition(sec, x, y, sx - x, h, level + 1, base, depth);
      partition(sec, sx + 1, y, x + w - sx - 1, h, level + 1, base, depth);
    } else {
      var sy = y + SS.rn1(h - minRoom * 2, minRoom);
      for (var xx = x; xx < x + w; xx++) sec.setTile(xx, sy, T.WALL);
      cutOpening(sec, x, sy, x + w - 1, sy, false, depth);
      partition(sec, x, y, w, sy - y, level + 1, base, depth);
      partition(sec, x, sy + 1, w, y + h - sy - 1, level + 1, base, depth);
    }
  }

  /* Every partition gets a gap so no room is sealed.  Some gaps are doors,
     some are energy screens you can fly through but not shoot through, and
     the rest are simply holes.

     The arithmetic has to stay inside the wall.  An opening that runs off the
     end writes its tiles into the neighbouring structure and leaves the wall
     it was supposed to open still solid - which is how a room ends up sealed,
     and it only happens on the short walls that a deep, heavily subdivided
     base produces a lot of. */
  function cutOpening(sec, x1, y1, x2, y2, vertical, depth) {
    var span = (vertical ? (y2 - y1) : (x2 - x1)) + 1;
    if (span < 3) {
      /* too short to hold a gap with margins - drop the wall entirely */
      for (var k = 0; k < span; k++) {
        sec.setTile(vertical ? x1 : x1 + k, vertical ? y1 + k : y1, T.EMPTY);
      }
      return;
    }

    var maxGap = Math.min(4, span - 2);
    var openings = span > 20 ? 2 : 1;
    for (var o = 0; o < openings; o++) {
      var gap = 1 + SS.rn2(maxGap);
      var at = 1 + SS.rn2(Math.max(1, span - gap - 1));
      var roll = SS.rn2(10);
      var kind = roll < 4 ? T.DOOR : (roll < 6 ? T.SCREEN : T.EMPTY);
      var group = 1 + SS.rn2(7);
      for (var i = 0; i < gap; i++) {
        var tx = vertical ? x1 : x1 + at + i;
        var ty = vertical ? y1 + at + i : y1;
        sec.setTile(tx, ty, kind);
        if (kind === T.DOOR) sec.doorGroup[sec.idx(tx, ty)] = group;
      }
    }
  }

  /* Doors in the outer shell, so a base is enterable but not a free lane.

     A door that opens straight into an asteroid is not an entrance, so each
     one gets a short apron cleared outside it, and the position is recorded
     so the connectivity pass can find its way here later. */
  function punchEntrances(sec, base) {
    base.entrances = [];
    var sides = SS.shuffle([0, 1, 2, 3]);
    var count = 2 + SS.rn2(2);
    for (var i = 0; i < count; i++) {
      var side = sides[i % 4];
      var group = 1 + SS.rn2(7);
      var gap = 3 + SS.rn2(2);
      var tx, ty, k, ox = 0, oy = 0;

      if (side === 0 || side === 1) {            // top / bottom
        var sx = base.x + 2 + SS.rn2(Math.max(1, base.w - gap - 4));
        ty = side === 0 ? base.y : base.y + base.h - 1;
        oy = side === 0 ? -1 : 1;
        for (k = 0; k < gap; k++) {
          tx = sx + k;
          if (tx <= base.x || tx >= base.x + base.w - 1) continue;
          sec.setTile(tx, ty, T.DOOR);
          sec.doorGroup[sec.idx(tx, ty)] = group;
          clearApron(sec, tx, ty, ox, oy);
          base.entrances.push({ x: tx, y: ty });
        }
      } else {                                    // left / right
        var sy = base.y + 2 + SS.rn2(Math.max(1, base.h - gap - 4));
        tx = side === 2 ? base.x : base.x + base.w - 1;
        ox = side === 2 ? -1 : 1;
        for (k = 0; k < gap; k++) {
          ty = sy + k;
          if (ty <= base.y || ty >= base.y + base.h - 1) continue;
          sec.setTile(tx, ty, T.DOOR);
          sec.doorGroup[sec.idx(tx, ty)] = group;
          clearApron(sec, tx, ty, ox, oy);
          base.entrances.push({ x: tx, y: ty });
        }
      }
    }
  }

  function clearApron(sec, tx, ty, ox, oy) {
    for (var d = 1; d <= 3; d++) {
      var ax = tx + ox * d, ay = ty + oy * d;
      if (sec.tileAt(ax, ay) === T.ROCK) sec.setTile(ax, ay, T.EMPTY);
      /* widen it a little so the lane is flyable, not a keyhole */
      var px = oy, py = ox;
      if (sec.tileAt(ax + px, ay + py) === T.ROCK) sec.setTile(ax + px, ay + py, T.EMPTY);
      if (sec.tileAt(ax - px, ay - py) === T.ROCK) sec.setTile(ax - px, ay - py, T.EMPTY);
    }
  }

  /* Belt and braces on the base interior.

     The partitioning is supposed to leave every room connected, and now it
     does - but "supposed to" is not a guarantee, and a room sealed inside a
     base is worse than a merely ugly one: it holds greens you can see and can
     never reach.  So flood the interior from one room and knock a hole
     through to anything the flood did not find.  On a well-formed base this
     does nothing at all. */
  function connectRooms(sec, base) {
    if (base.rooms.length < 2) return;

    var x0 = base.x, y0 = base.y, w = base.w, h = base.h;
    function inside(tx, ty) {
      return tx > x0 && tx < x0 + w - 1 && ty > y0 && ty < y0 + h - 1;
    }
    function passable(tx, ty) {
      var t = sec.tileAt(tx, ty);
      return t === T.EMPTY || t === T.DOOR || t === T.SCREEN;
    }

    var centres = base.rooms.map(function (r) {
      return { x: Math.floor(r.x + r.w / 2), y: Math.floor(r.y + r.h / 2) };
    });

    var seen = {};
    function flood(sx, sy) {
      var stack = [[sx, sy]];
      seen[sx + ',' + sy] = true;
      while (stack.length) {
        var cur = stack.pop();
        for (var d = 0; d < 4; d++) {
          var nx = cur[0] + (d === 0 ? 1 : d === 1 ? -1 : 0);
          var ny = cur[1] + (d === 2 ? 1 : d === 3 ? -1 : 0);
          if (!inside(nx, ny) || seen[nx + ',' + ny] || !passable(nx, ny)) continue;
          seen[nx + ',' + ny] = true;
          stack.push([nx, ny]);
        }
      }
    }
    flood(centres[0].x, centres[0].y);

    for (var i = 1; i < centres.length; i++) {
      var c = centres[i];
      if (seen[c.x + ',' + c.y]) continue;
      /* walk towards the first room, opening whatever is in the way */
      var tx = c.x, ty = c.y;
      var guard = 0;
      while ((tx !== centres[0].x || ty !== centres[0].y) && guard++ < w + h + 8) {
        if (tx !== centres[0].x) tx += SS.sgn(centres[0].x - tx);
        else ty += SS.sgn(centres[0].y - ty);
        if (inside(tx, ty) && sec.tileAt(tx, ty) === T.WALL) {
          sec.setTile(tx, ty, T.EMPTY);
          sec.doorGroup[sec.idx(tx, ty)] = 0;
        }
      }
      flood(c.x, c.y);
    }
  }

  /* Bases are where the good greens live, which is the whole reason to risk
     flying into one. */
  function stockBase(sec, base, depth) {
    base.rooms.forEach(function (r) {
      if (r.w < 4 || r.h < 4) return;
      var n = 1 + SS.rn2(3);
      for (var i = 0; i < n; i++) {
        var x = r.x + 1 + SS.rn2(Math.max(1, r.w - 2));
        var y = r.y + 1 + SS.rn2(Math.max(1, r.h - 2));
        if (sec.tileAt(x, y) !== T.EMPTY) continue;
        sec.greens.push(makeGreen(x + 0.5, y + 0.5, true));
      }
      /* the odd deep room holds something that never appears in open space */
      if (depth >= 4 && SS.rn2(9) === 0) {
        var sx = r.x + Math.floor(r.w / 2), sy = r.y + Math.floor(r.h / 2);
        if (sec.tileAt(sx, sy) === T.EMPTY) {
          var g = makeGreen(sx + 0.5, sy + 0.5, true);
          g.special = SS.pick(SS.SPECIAL_PRIZES);
          sec.greens.push(g);
        }
      }
    });
  }

  /* ---- safe zones, wormholes, portals --------------------------------- */

  function placeSafeZones(sec, depth) {
    /* Fewer safe pads the deeper you go; the Core has none at all. */
    var count = depth >= SS.MAXDEPTH ? 0 : Math.max(1, 3 - Math.floor(depth / 9));
    for (var i = 0; i < count; i++) {
      var spot = findOpenArea(sec, 7);
      if (!spot) continue;
      for (var dy = -3; dy <= 3; dy++) {
        for (var dx = -3; dx <= 3; dx++) {
          if (dx * dx + dy * dy > 11) continue;
          if (sec.tileAt(spot.x + dx, spot.y + dy) === T.EMPTY) {
            sec.setTile(spot.x + dx, spot.y + dy, T.SAFE);
          }
        }
      }
      sec.safeZones.push({ x: spot.x, y: spot.y });
    }
  }

  /* A wormhole's pull follows Continuum's inverse-square law, and inside
     about eleven tiles it beats any hull's thrust outright - a fully prized
     Warbird on full afterburner cannot climb out.  That is fine, and it is
     the point: a wormhole is not an obstacle to be escaped, it is a thing
     that moves you.  But it makes the destination a safety-critical number.
     Anything dropped inside that radius is dropped into a trap, and if the
     destination is another wormhole's mouth the two of them will throw a ship
     back and forth for as long as the sector exists. */
  var WORMHOLE_ESCAPE = 12;         // tiles: thrust starts to win out here
  var WORMHOLE_SAFE_DIST = 26;      // tiles: how far a destination must sit
  SS.WORMHOLE_ESCAPE = WORMHOLE_ESCAPE;
  SS.WORMHOLE_SAFE_DIST = WORMHOLE_SAFE_DIST;

  function placeWormholes(sec, t) {
    var count = SS.rn2(3) + (t > 0.4 ? 1 : 0);
    for (var i = 0; i < count; i++) {
      var spot = findOpenArea(sec, 6);
      if (!spot) continue;
      for (var dy = -2; dy <= 2; dy++) {
        for (var dx = -2; dx <= 2; dx++) {
          if (dx * dx + dy * dy > 5) continue;
          if (sec.tileAt(spot.x + dx, spot.y + dy) === T.EMPTY) {
            sec.setTile(spot.x + dx, spot.y + dy, T.WORMHOLE);
          }
        }
      }
      sec.wormholes.push({
        x: spot.x + 0.5, y: spot.y + 0.5,
        dest: null, nextSwitch: 0
      });
    }
    retargetWormholes(sec, true);
  }

  /* Where a wormhole throws you: open space, well clear of every wormhole in
     the sector - including itself.  Continuum re-rolls this on a timer rather
     than wiring holes to each other permanently, which is both what the
     WormholeSwitchTime setting is for and the reason a wormhole never becomes
     a predictable shuttle service. */
  function wormholeDestination(sec) {
    var best = null, bestClearance = -1;
    for (var attempt = 0; attempt < 300; attempt++) {
      /* room to arrive at speed, and the wormhole check done here rather than
         in the helper so the near-misses can be ranked */
      var spot = SS.randomOpenSpot(sec, { clearance: 4, minWormholeDist: 0 });
      var clearance = distanceToNearestWormhole(sec, spot);
      if (clearance >= WORMHOLE_SAFE_DIST) return spot;
      if (clearance > bestClearance) { bestClearance = clearance; best = spot; }
    }
    /* A cramped sector might have nowhere that far from every hole; take the
       roomiest spot found rather than dropping someone down a well. */
    return best || { x: sec.size / 2, y: sec.size / 2 };
  }
  SS.wormholeDestination = wormholeDestination;

  function distanceToNearestWormhole(sec, pos) {
    var best = Infinity;
    for (var i = 0; i < sec.wormholes.length; i++) {
      var d = SS.dist(pos, sec.wormholes[i]);
      if (d < best) best = d;
    }
    return best;
  }
  SS.distanceToNearestWormhole = distanceToNearestWormhole;

  function retargetWormholes(sec, force) {
    for (var i = 0; i < sec.wormholes.length; i++) {
      var w = sec.wormholes[i];
      if (!force && sec.clock < w.nextSwitch) continue;
      w.dest = wormholeDestination(sec);
      w.nextSwitch = sec.clock + SS.ARENA.WormholeSwitchTime;
    }
  }
  SS.retargetWormholes = retargetWormholes;

  /* Called once per tick from the game loop. */
  Sector.prototype.tickWormholes = function () {
    retargetWormholes(this, false);
  };

  function placePortals(sec, depth) {
    var up = findOpenArea(sec, 6);
    if (!up) up = { x: 20, y: 20 };
    stampPortal(sec, up.x, up.y, T.PORTAL_UP);
    sec.portalUp = { x: up.x + 0.5, y: up.y + 0.5 };
    sec.spawn = { x: up.x + 0.5, y: up.y + 0.5 };

    /* The way down goes as far from the way up as the sector allows, so that
       arriving never means immediately leaving. */
    var best = null, bestD = -1;
    for (var a = 0; a < 300; a++) {
      var c = findOpenArea(sec, 5);
      if (!c) continue;
      var d = SS.length2(c.x - up.x, c.y - up.y);
      if (d > bestD) { bestD = d; best = c; }
      if (bestD > (SIZE * 0.55) * (SIZE * 0.55)) break;
    }
    if (!best) best = { x: SIZE - 20, y: SIZE - 20 };
    if (depth < SS.MAXDEPTH) {
      stampPortal(sec, best.x, best.y, T.PORTAL_DOWN);
      sec.portalDown = { x: best.x + 0.5, y: best.y + 0.5 };
    } else {
      sec.portalDown = null;
      sec.coreSpot = { x: best.x + 0.5, y: best.y + 0.5 };
    }
  }

  function stampPortal(sec, cx, cy, tile) {
    for (var dy = -2; dy <= 2; dy++) {
      for (var dx = -2; dx <= 2; dx++) {
        if (dx * dx + dy * dy > 5) continue;
        sec.setTile(cx + dx, cy + dy, tile);
      }
    }
    /* keep a landing pad clear around it */
    for (var y = -5; y <= 5; y++) {
      for (var x = -5; x <= 5; x++) {
        if (x * x + y * y > 25) continue;
        if (sec.tileAt(cx + x, cy + y) === T.ROCK) sec.setTile(cx + x, cy + y, T.EMPTY);
      }
    }
  }

  /* The bottom of the dungeon: a sealed vault holding the Prime Flag.

     It needs a site big enough for a 26x22 building with room to breathe, and
     as far from the arrival portal as the sector will allow, so that reaching
     it is a journey.  The footprint is registered like any other base so that
     nothing generated afterwards is stamped through its walls. */
  function placeCore(sec) {
    var w = 26, h = 22;
    var anchor = sec.portalUp || sec.spawn || { x: SIZE / 2, y: SIZE / 2 };
    var spot = null, bestD = -1;
    for (var attempt = 0; attempt < 60; attempt++) {
      var c = findOpenArea(sec, 16, 20);
      if (!c) break;
      var d = SS.length2(c.x - anchor.x, c.y - anchor.y);
      if (d > bestD) { bestD = d; spot = c; }
    }
    if (!spot) spot = findOpenArea(sec, 13, 15);
    if (!spot && sec.coreSpot) {
      spot = { x: Math.floor(sec.coreSpot.x), y: Math.floor(sec.coreSpot.y) };
    }
    if (!spot) spot = { x: SIZE - 40, y: SIZE - 40 };

    var x0 = SS.clamp(spot.x - w / 2 | 0, 8, SIZE - w - 8);
    var y0 = SS.clamp(spot.y - h / 2 | 0, 8, SIZE - h - 8);
    var x, y;
    for (y = y0; y < y0 + h; y++) {
      for (x = x0; x < x0 + w; x++) sec.setTile(x, y, T.EMPTY);
    }
    for (x = x0; x < x0 + w; x++) {
      sec.setTile(x, y0, T.WALL); sec.setTile(x, y0 + h - 1, T.WALL);
    }
    for (y = y0; y < y0 + h; y++) {
      sec.setTile(x0, y, T.WALL); sec.setTile(x0 + w - 1, y, T.WALL);
    }
    /* one door on each side, all on the same group, so the vault breathes in
       and out as a single lung */
    var group = 1;
    for (var k = -1; k <= 1; k++) {
      door(sec, x0 + (w >> 1) + k, y0, group);
      door(sec, x0 + (w >> 1) + k, y0 + h - 1, group);
      door(sec, x0, y0 + (h >> 1) + k, group);
      door(sec, x0 + w - 1, y0 + (h >> 1) + k, group);
    }

    var cx = x0 + (w >> 1), cy = y0 + (h >> 1);
    for (var dy = -1; dy <= 1; dy++) {
      for (var dx = -1; dx <= 1; dx++) sec.setTile(cx + dx, cy + dy, T.FLAGSTAND);
    }
    sec.flagStand = { x: cx + 0.5, y: cy + 0.5 };
    sec.coreRoom = { x: x0, y: y0, w: w, h: h };
    /* claim the footprint so later placements route around it */
    sec.bases.push({ x: x0, y: y0, w: w, h: h, rooms: [], vault: true });
  }

  function door(sec, tx, ty, group) {
    sec.setTile(tx, ty, T.DOOR);
    sec.doorGroup[sec.idx(tx, ty)] = group;
  }

  /* ---- greens and wrecks ---------------------------------------------- */

  /* Greens are anonymous - nothing ever refers to one except by its index in
     the sector's list - so they carry no id.  With four hundred of them per
     sector and twenty-six sectors in a save, the field that nobody reads is
     not free. */
  function makeGreen(x, y, inBase) {
    return {
      x: x, y: y,
      taken: 0,          // sector clock time at which it was taken
      inBase: !!inBase,
      special: 0         // non-zero forces a particular prize
    };
  }

 * hard to kill because it launched with more greens than you have.

    if (game.autosaveTimer > 20) {
      game.autosaveTimer = 0;
      SS.save.saveGame();
    }
  }

  /* The test harness drives the simulation directly rather than through
     requestAnimationFrame, so one tick is part of the public surface. */
  game.step = tick;

  function allShips() {
    var list = [game.player];
    var e = game.sector.enemies;
    for (var i = 0; i < e.length; i++) if (e[i].alive) list.push(e[i]);
    return list;
  }
  game.allShips = allShips;

  /* ---- weapon callbacks ------------------------------------------------ */

  var callbacks = {
    onHit: function (sh, damage, w, killed) {
      if (!killed) {
        if (sh === game.player) SS.render.flash(sh.x, sh.y, '#ff6666');
        return;
      }
      SS.render.explosion(sh.x, sh.y, 3.2, '#ffaa55');
      if (sh === game.player) return;      // handled by reapEnemies

      sh.alive = false;
      if (w.owner === game.player.id) creditKill(sh);
    },
    onExplode: function (w, radius) {
      SS.render.explosion(w.x, w.y, radius, w.type === 'thor' ? '#88ccff' : '#ff8844');
    }
  };

  function creditKill(victim) {
    var p = game.player;
    p.kills++;
    game.kills[victim.enemyKey] = (game.kills[victim.enemyKey] || 0) + 1;
    /* SubSpace's reward: what a kill is worth scales with the victim's
       bounty, so the pilots that hurt are the pilots that pay. */
    var award = SS.ARENA.RewardBase / 2 + victim.bounty * 12 + game.depth * 8;
    if (victim.isBoss) award *= 6;
    game.points += Math.round(award);
    p.bounty += SS.ARENA.BountyIncreaseForKill;
    SS.render.pickup(victim.x, victim.y, '+' + Math.round(award), '#ffd98a');
  }

  function reapEnemies(sec) {
    for (var i = sec.enemies.length - 1; i >= 0; i--) {
      var e = sec.enemies[i];
      if (e.alive) continue;
      if (!e.spilled) {
        e.spilled = true;
        SS.ship.spillPrizes(e, sec);
        if (e.isBoss) {
          SS.msgBig('The Core Guardian breaks apart.', '#ffe08a');
        }
      }
      sec.enemies.splice(i, 1);
    }
  }

  /* ---- greens ---------------------------------------------------------- */

  function collectGreens(sec, p) {
    if (!p.alive) return;
    var reach = p.radius + 0.8;
    for (var i = sec.greens.length - 1; i >= 0; i--) {
      var g = sec.greens[i];
      if (g.expires && sec.clock > g.expires) { sec.greens.splice(i, 1); continue; }
      if (g.taken && sec.clock - g.taken < SS.ARENA.PrizeDelay) continue;
      if (SS.dist2(p, g) > reach * reach) continue;
      takeGreen(sec, p, g, i);
    }
  }

  function takeGreen(sec, p, g, index) {
    var prizeId;
    if (g.special) prizeId = g.special;
    else prizeId = SS.rollPrize(SS.ship.def(p), SS.negativeFactorFor(sec.depth));

    var msg = SS.ship.applyPrize(p, prizeId, sec);
    var negative = prizeId < 0;
    var def = SS.prizeById(prizeId);

    game.greensTaken++;
    if (def) {
      var entry = game.prizeLog[def.id] || (game.prizeLog[def.id] = { took: 0, lost: 0 });
      if (negative) entry.lost++; else entry.took++;
    }

    if (msg) {
      SS.msg(msg, negative ? '#ff8a6a' : '#9fffc0');
      SS.render.pickup(g.x, g.y, msg.replace(/\.$/, ''), negative ? '#ff8a6a' : '#9fffc0');
    }

    /* Greens in open space come back after a delay, the way a zone respawns
       them; the ones inside a base and the ones spilled by a kill do not. */
    if (g.inBase || g.expires || g.special) sec.greens.splice(index, 1);
    else g.taken = sec.clock;
  }

  function checkWrecks(sec, p) {
    for (var i = 0; i < sec.wrecks.length; i++) {
      var wr = sec.wrecks[i];
      if (wr.broken) continue;
      if (SS.dist2(p, wr) > 4) continue;
      wr.broken = true;
      SS.render.explosion(wr.x, wr.y, 2.0, '#ffcc66');
      SS.msg('The derelict breaks open.', '#ffd98a');
      for (var k = 0; k < wr.prizes; k++) {
        var a = SS.rng.float() * Math.PI * 2;
        var r = SS.rnf(1.5, 6);
        var gx = SS.clamp(wr.x + Math.cos(a) * r, 2, sec.size - 3);
        var gy = SS.clamp(wr.y + Math.sin(a) * r, 2, sec.size - 3);
        if (sec.solidAtPos(gx, gy)) continue;
        var g = SS.makeGreen(gx, gy, true);
        sec.greens.push(g);
      }
    }
  }

  /* ---- wormholes and portals ------------------------------------------- */

  /* Move one ship through a wormhole, if it is in the mouth of one and has
     not already been taken by it.
   *
   * The re-arm is spatial, not a countdown.  A timer only works if the ship
   * can get clear before it expires, and inside a well nothing can: the pull
   * beats any hull's thrust, so a ship dropped near a mouth is simply taken
   * again the moment the timer runs out.  Requiring the ship to actually
   * leave every well before it can be grabbed again is the condition that
   * cannot loop.  With destinations now placed clear of every hole, this is
   * belt and braces - but it is the belt.
   *
   * Momentum is conserved, as it is in the original: a wormhole flings you,
   * it does not park you. */
  function wormholeTransit(sec, sh) {
    var w = SS.physics.wormholeAt(sec, sh.x, sh.y);
    if (!w) {
      sh.inWormhole = false;         // clear of them all: re-arm
      return null;
    }
    if (sh.inWormhole || sh.timer.spawnGuard > 0) return null;

    var dest = w.dest || SS.wormholeDestination(sec);
    sh.x = dest.x;
    sh.y = dest.y;
    sh.inWormhole = true;
    return dest;
  }

  function checkWormholes(sec, p) {
    var dest = wormholeTransit(sec, p);
    if (dest) {
      SS.render.flash(dest.x, dest.y, '#a060ff');
      SS.msg('The wormhole spits you out somewhere else.', '#c9a0ff');
      SS.radar.revealAround(sec, dest.x, dest.y, 18);
    }

    /* Pilots go through them too.  They were always subject to the gravity
       and never to the transit, so every well in the sector quietly filled up
       with ships that could not thrust their way back out and were never
       thrown clear - a hazard that ate the sector's population. */
    for (var i = 0; i < sec.enemies.length; i++) {
      var e = sec.enemies[i];
      if (!e.alive) continue;
      if (wormholeTransit(sec, e)) {
        e.patrolTarget = null;       // wherever it was going, it is not there now
      }
    }
  }

  function checkPortals(sec, p) {
    if (p.timer.spawnGuard > 0) return;
    var t = sec.tileAt(Math.floor(p.x), Math.floor(p.y));

    if (t === SS.T.PORTAL_DOWN) {
      game.changeSector(1);
      return;
    }
    if (t === SS.T.PORTAL_UP) {
      if (game.depth === 1) {
        if (p.hasFlag) { game.win(); return; }
        if (!game.leaveWarned) {
          game.leaveWarned = true;
          SS.msg('This portal leads out of the sector chain. Come back with the Prime Flag.', '#9fd6ff');
        }
        return;
      }
      game.changeSector(-1);
      return;
    }
    if (t === SS.T.FLAGSTAND && !game.flagTaken && sec.depth === SS.MAXDEPTH) {
      takeFlag();
    }
  }

  function takeFlag() {
    game.flagTaken = true;
    game.player.hasFlag = true;
    game.points += 5000;
    SS.msgBig('You have the Prime Flag.', '#ff8888');
    SS.msg('Every pilot in the chain now knows exactly where you are.', '#ff8888');
  }

  /* ---- reinforcements --------------------------------------------------- */

  function trickleReinforcements(sec, dt) {
    game.spawnTimer = (game.spawnTimer || 0) + dt;
    var interval = (game.player.hasFlag ? 4.0 : 18.0) * SS.difficulty().reinforcements;
    if (game.spawnTimer < interval) return;
    game.spawnTimer = 0;
    SS.spawnWanderer(sec, sec.depth, game.player, game.player.hasFlag);
  }

  /* ------------------------------------------------------------------ */
  /* discrete actions                                                   */
  /* ------------------------------------------------------------------ */

  function handleActions() {
    var actions = SS.input.takeActions();
    if (!actions.length) return;
    var p = game.player, sec = game.sector;

    for (var i = 0; i < actions.length; i++) {
      switch (actions[i]) {
        case 'bomb': SS.weapons.fireBomb(p, sec); break;
        case 'mine':
          if (!SS.weapons.fireMine(p, sec)) SS.msg('No mines.', '#ff9a6a');
          break;
        case 'burst':
          if (!SS.weapons.fireBurst(p, sec)) SS.msg('No bursts left.', '#ff9a6a');
          break;
        case 'repel':
          if (!SS.weapons.useRepel(p, sec, allShips())) SS.msg('No repels left.', '#ff9a6a');
          break;
        case 'decoy':
          if (!SS.weapons.useDecoy(p, sec)) SS.msg('No decoys left.', '#ff9a6a');
          break;
        case 'thor':
          if (!SS.weapons.fireThor(p, sec)) SS.msg('No thors left.', '#ff9a6a');
          break;
        case 'brick':
          if (!SS.weapons.useBrick(p, sec)) SS.msg('No room to lay a brick.', '#ff9a6a');
          break;
        case 'rocket':
          if (SS.weapons.useRocket(p)) SS.msg('Rocket!', '#ffd98a');
          else SS.msg('No rockets left.', '#ff9a6a');
          break;
        case 'portal': usePortal(p, sec); break;
        case 'warp': warpSelf(p, sec); break;
        case 'multifire':
          if (!p.has.multifire) { SS.msg('This hull has no multifire.', '#ff9a6a'); break; }
          p.wantsMulti = !p.wantsMulti;
          SS.msg(p.wantsMulti ? 'Multifire on.' : 'Multifire off.');
          break;
        case 'cloak': toggle(p, 'cloak'); break;
        case 'stealth': toggle(p, 'stealth'); break;
        case 'xradar': toggle(p, 'xradar'); break;
        case 'antiwarp': toggle(p, 'antiwarp'); break;
        case 'pause':
          game.paused = !game.paused;
          SS.msg(game.paused ? 'Paused.' : 'Resumed.');
          break;
        case 'save': SS.save.saveGame(); SS.msg('Saved.'); break;
        case 'menu': SS.commands.openMenu(); break;
        case 'help': SS.commands.help(); break;
        case 'discoveries': SS.commands.discoveries(); break;
        case 'shipinfo': SS.commands.shipReadout(); break;
      }
    }
  }

  function toggle(p, name) {
    if (!p.has[name]) { SS.msg('You do not have ' + name + '.', '#ff9a6a'); return; }
    var on = SS.ship.toggle(p, name);
    SS.msg(SS.capitalize(name) + (on ? ' on.' : ' off.'));
  }

  function usePortal(p, sec) {
    var blocker = SS.radar.warpBlocked(sec, p);
    if (blocker && p.portalDrop) {
      SS.msg('Antiwarp: you cannot warp with a ' + blocker.name + ' this close.', '#ff9a6a');
      return;
    }
    var r = SS.weapons.usePortal(p, sec);
    if (r === 'drop') {
      SS.msg('Portal dropped.', '#c9a0ff');
      SS.render.flash(p.x, p.y, '#aa66ff');
    } else if (r === 'warp') {
      SS.msg('Warping to your portal.', '#c9a0ff');
      SS.render.flash(p.x, p.y, '#aa66ff');
      SS.radar.revealAround(sec, p.x, p.y, 16);
    } else {
      SS.msg('No portals left.', '#ff9a6a');
    }
  }

  function warpSelf(p, sec) {
    var blocker = SS.radar.warpBlocked(sec, p);
    if (blocker) {
      SS.msg('Antiwarp holds you in place.', '#ff9a6a');
      return;
    }
    var spot = SS.randomOpenSpot(sec, { away: p, minDist: 30 });
    p.x = spot.x; p.y = spot.y;
    p.vx = p.vy = 0;
    p.timer.spawnGuard = 1.0;
    SS.render.flash(spot.x, spot.y, '#88ccff');
    SS.radar.revealAround(sec, spot.x, spot.y, 16);
    SS.msg('Warp.');
  }

  /* ------------------------------------------------------------------ */
  /* moving between sectors                                             */
  /* ------------------------------------------------------------------ */

  game.changeSector = function (delta) {
    var p = game.player;
    var target = game.depth + delta;
    if (target < 1) target = 1;
    if (target > SS.MAXDEPTH) target = SS.MAXDEPTH;
    if (target === game.depth) return;

    game.sector.playerLeftAt = game.sector.clock;
    game.depth = target;
    if (target > game.maxDepthReached) game.maxDepthReached = target;

    var fresh = false;
    if (!game.sectors[target]) {
      game.sectors[target] = SS.makeSector(target);
      fresh = true;
    }
    var sec = game.sectors[target];
    game.sector = sec;

    /* Arrive on the portal that matches the direction of travel, the way a
       staircase pairs up. */
    var arrival = delta > 0 ? sec.portalUp : sec.portalDown;
    if (!arrival) arrival = sec.spawn || SS.randomOpenSpot(sec, {});
    p.x = arrival.x; p.y = arrival.y;
    p.vx = p.vy = 0;
    p.timer.spawnGuard = 2.0;
    p.portalDrop = null;             // a beacon does not survive a sector warp

    /* the air clears when you leave */
    sec.shots = [];
    sec.decoys = [];

    SS.radar.reset();
    SS.radar.revealAround(sec, p.x, p.y, 24);

    SS.msgBig('Sector ' + target, delta > 0 ? '#ffd24a' : '#4ac8ff');
    if (fresh && target === SS.MAXDEPTH) {
      SS.msg('Something very large is awake down here.', '#ff8888');
    }
    if (p.hasFlag) {
      SS.msg('The Flag is drawing them in.', '#ff8888');
    }
    sec.visited = true;
    SS.save.saveGame();
  };

  /* ------------------------------------------------------------------ */
  /* endgame                                                            */
  /* ------------------------------------------------------------------ */

  game.death = function (killerId) {
    if (game.over) return;
    var p = game.player;
    var killer = null;
    for (var i = 0; i < game.sector.enemies.length; i++) {
      if (game.sector.enemies[i].id === killerId) killer = game.sector.enemies[i];
    }
    SS.render.explosion(p.x, p.y, 5, '#ffaa55');
    p.deaths++;

    /* With hulls to spare this is SubSpace's death rather than NetHack's: you
       lose the ship and everything the greens had built on it, and you go
       again.  That loss is the whole penalty and it is a real one - a hull
       stripped back to factory in sector 19 is in serious trouble. */
    if (game.shipsLeft > 1) {
      game.shipsLeft--;
      respawnPlayer(killer);
      return;
    }

    game.shipsLeft = 0;
    game.over = true;
    game.killer = killer ? killer.name : null;
    game.deathReason = killer
      ? 'shot down by ' + SS.anArticle(killer.name)
      : 'destroyed in sector ' + game.depth;
  };

  function respawnPlayer(killer) {
    var p = game.player;
    var sec = game.sector;

    /* The Flag does not come back with you.  It returns to the vault it came
       from, so the climb has to be done again - the one part of a run that
       spare hulls do not soften. */
    if (p.hasFlag) {
      p.hasFlag = false;
      game.flagTaken = false;
      SS.msgBig('The Prime Flag falls back to the Core.', '#ff8888');
    }

    SS.ship.resetToInitial(p);
    var spot = sec.portalUp || sec.spawn || SS.randomOpenSpot(sec, {});
    p.x = spot.x; p.y = spot.y;
    p.vx = p.vy = 0;
    p.inWormhole = false;
    p.timer.spawnGuard = SS.ARENA.EnterDelay + 1.0;

    SS.radar.revealAround(sec, p.x, p.y, 20);
    SS.msgBig(game.shipsLeft + ' ' + SS.plural(game.shipsLeft, 'hull') + ' left',
      '#ffaa66');
    SS.msg(killer
      ? 'Shot down by ' + SS.anArticle(killer.name) + '. A fresh hull launches.'
      : 'Your hull is lost. A fresh one launches.', '#ffaa66');
    SS.msg('Everything the greens had built is gone with it.', '#ff9a6a');
    SS.save.saveGame();
  }

  game.win = function () {
    if (game.over) return;
    game.over = true;
    game.won = true;
    game.escaped = true;
    game.deathReason = 'warped out with the Prime Flag';
  };

  game.quitRun = function () {
    if (game.over) return;
    game.over = true;
    game.quit = true;
    game.deathReason = 'quit';
  };

  game.computeScore = function () {
    var p = game.player;
    var score = game.points;
    score += 220 * (game.maxDepthReached - 1);
    score += game.greensTaken * 6;
    score += Math.round(p.bounty) * 25;
    if (game.won) score = score * 2 + 25000;
    score *= SS.difficulty().scoreMultiplier;
    return Math.max(0, Math.round(score));
  };

  game.endGame = async function () {
    if (game.ended) return;
    game.ended = true;
    var p = game.player;
    if (!p) return;

    SS.save.deleteSave();
    var score = game.computeScore();
    var lines = [];

    if (game.won) {
      lines.push({ text: '' });
      lines.push({ text: '   You warp out of sector 1 with the Prime Flag aboard.' });
      lines.push({ text: '' });
      lines.push({ text: '   Twenty-six sectors down and twenty-six back up,' });
      lines.push({ text: '   in a ' + SS.ship.def(p).name + ', alone.' });
      lines.push({ text: '' });
    } else if (game.quit) {
      lines.push({ text: '' });
      lines.push({ text: '   You disengaged in sector ' + game.depth + '.' });
      lines.push({ text: '' });
    } else {
      /* a wreck, where a roguelike would put a tombstone */
      var hull = SS.ship.def(p).name;
      lines.push({ text: '' });
      lines.push({ text: '            .    *        .              *        .' });
      lines.push({ text: '                    \\   |   /' });
      lines.push({ text: '        *        --   ' + center(hull.toUpperCase(), 11) + '   --          .' });
      lines.push({ text: '                    /   |   \\' });
      lines.push({ text: '         .                              *' });
      lines.push({ text: '' });
      lines.push({ text: '        ' + center(p.name, 24) });
      lines.push({ text: '        ' + center('sector ' + game.depth, 24) });
      lines.push({ text: '        ' + center(String(new Date().getFullYear()), 24) });
      lines.push({ text: '' });
    }

    lines.push({ text: '  ' + p.name + ' the ' + SS.rankTitle(score) +
      ', flying a ' + SS.ship.def(p).name +
      ' on ' + SS.difficulty().name + '.' });
    lines.push({ text: '  ' + SS.capitalize(game.deathReason || 'lost') +
      ' with ' + SS.commify(score) + ' points, after ' + SS.clockString(game.elapsed) + '.' });
    lines.push({ text: '  Reached sector ' + game.maxDepthReached + ' of ' + SS.MAXDEPTH +
      ', took ' + game.greensTaken + ' greens, and shot down ' + p.kills +
      ' ' + SS.plural(p.kills, 'pilot') + '.' });
    if (p.deaths > 0) {
      lines.push({ text: '  Lost ' + p.deaths + ' ' + SS.plural(p.deaths, 'hull') +
        ' along the way.' });
    }
    lines.push({ text: '' });

    var killList = Object.keys(game.kills);
    if (killList.length) {
      lines.push({ header: true, text: 'Shot down' });
      killList.sort(function (a, b) { return game.kills[b] - game.kills[a]; });
      killList.slice(0, 14).forEach(function (k) {
        var def = SS.enemyByKey(k);
        lines.push({ text: '  ' + padRight(String(game.kills[k]), 5) + (def ? def.name : k) });
      });
      lines.push({ text: '' });
    }

    lines.push({ header: true, text: 'Final hull' });
    SS.commands.readoutLines(p).forEach(function (l) { lines.push(l); });

    SS.save.addScore({
      name: p.name, ship: p.shipKey, score: score, difficulty: game.difficulty,
      depth: game.depth, maxDepth: game.maxDepthReached,
      kills: p.kills, greens: game.greensTaken,
      seconds: Math.round(game.elapsed),
      how: game.deathReason, when: Date.now(), won: !!game.won
    });

    await SS.hud.showText(lines, game.won ? 'You made it out.' : 'Wreckage');
    await game.showScores();
    await SS.main.titleScreen();
  };

  game.showScores = async function () {
    var scores = SS.save.getScores();
    if (!scores.length) return;
    var lines = [{ header: true, text: '  #   Score    Pilot' }];
    scores.slice(0, 15).forEach(function (s, i) {
      lines.push({
        text: '  ' + padRight(String(i + 1), 4) +
          padRight(SS.commify(s.score), 9) +
          s.name + ' the ' + SS.rankTitle(s.score) +
          ', ' + (SS.SHIPS[s.ship] ? SS.SHIPS[s.ship].name : s.ship) +
          (s.difficulty && s.difficulty !== 'normal'
            ? ' [' + SS.difficultyByKey(s.difficulty).name + ']' : '') +
          ' - ' + s.how + ' (sector ' + s.maxDepth + ')'
      });
    });
    await SS.hud.showText(lines, 'Top scores');
  };

  function center(s, width) {
    s = String(s);
    if (s.length > width) s = s.slice(0, width);
    var pad = width - s.length;
    var left = Math.floor(pad / 2);
    return ' '.repeat(left) + s + ' '.repeat(pad - left);
  }

  function padRight(s, n) {
    s = String(s);
    while (s.length < n) s += ' ';
    return s;
  }
  game.padRight = padRight;

})(typeof window !== 'undefined' ? (window.SS = window.SS || {}) : (global.SS = global.SS || {}));

/* ===== js/main.js ===== */
/* 5Space - startup: the title screen, picking a hull, and the entry point. */
(function (SS) {
  'use strict';

  var main = {};
  SS.main = main;

  var LOGO = [
    '  ______  ____                                ',
    ' /      \\/    \\                               ',
    '|  $$$$$$|  $$$$$ ______   ____  _______  ___ ',
    '| $$____ \\$$    \\|      \\ /    \\/       \\/   \\',
    ' \\$$    \\  \\$$$$$|  $$$$$|  $$$$|  $$$$$$|  $$',
    ' _\\$$$$$$      \\$| $$  $$| $$   | $$   $$| $$ ',
    '|  \\__| $|\\__| $$| $$__$$| $$__ | $$$$$$$| $$ ',
    ' \\$$    $$\\$$   $$\\$$    $$\\$$  $$\\$$    $$\\$$ ',
    '  \\$$$$$$  \\$$$$$  \\$$$$$$$ \\$$$$  \\$$$$$$ \\$$ '
  ];

  main.titleScreen = async function () {
    SS.game.started = false;
    SS.hud.clearMessages();
    SS.input.clear();

    var info = SS.save.saveInfo();
    var rows = [];
    LOGO.forEach(function (l) {
      rows.push({ html: '<span class="logo">' + SS.hud.escapeHtml(l) + '</span>' });
    });
    rows.push({ text: '' });
    rows.push({ text: '  A SubSpace roguelike, version ' + SS.VERSION });
    rows.push({ text: '  Twenty-six sectors down, take the Prime Flag, fly it back out.' });
    rows.push({ text: '' });

    if (info) {
      var where = 'sector ' + info.depth + (info.hasFlag ? ', carrying the Flag' : '');
      rows.push({
        letter: 'c', selectable: true, value: 'continue',
        html: '<span class="hi">Continue</span> &mdash; ' + SS.hud.escapeHtml(
          info.name + ' in a ' + (SS.SHIPS[info.ship] ? SS.SHIPS[info.ship].name : info.ship) +
          ', ' + where + ' (' + SS.clockString(info.elapsed) + ')' +
          (info.difficulty === 'normal' ? '' :
            '  [' + SS.difficultyByKey(info.difficulty).name +
            (info.shipsLeft > 1 ? ', ' + info.shipsLeft + ' hulls' : ', last hull') + ']'))
      });
    }
    var mode = SS.DIFFICULTIES[main.storedDifficulty()];
    rows.push({ letter: 'n', selectable: true, value: 'new', text: 'New run' });
    rows.push({ letter: 'r', selectable: true, value: 'random', text: 'New run, random hull' });
    /* Shown on the front page rather than only inside the new-run flow, so
       the mode is something you can see and change before committing to
       anything. */
    rows.push({
      letter: 'd', selectable: true, value: 'difficulty',
      html: 'Difficulty: <span class="hi">' + SS.hud.escapeHtml(mode.name) + '</span> &mdash; ' +
        SS.hud.escapeHtml(mode.ships > 1
          ? mode.ships + ' hulls, a lost one costs what it carried'
          : 'one hull, permadeath')
    });
    rows.push({ letter: 'i', selectable: true, value: 'import', text: 'Import a run from a file' });
    if (info) rows.push({ letter: 'e', selectable: true, value: 'export', text: 'Export the saved run' });
    rows.push({ letter: 's', selectable: true, value: 'scores', text: 'Top scores' });
    rows.push({ letter: '?', selectable: true, value: 'help', text: 'How to play' });

    var sel = await SS.hud.menu('', rows, {
      full: true, footerText: '(Choose with a letter)'
    });
    var choice = sel && sel.length ? sel[0] : null;

    switch (choice) {
      case 'continue':
        if (SS.save.loadGame()) {
          SS.radar.revealAround(SS.game.sector, SS.game.player.x, SS.game.player.y, 24);
          SS.msg('Welcome back, ' + SS.game.player.name + '.');
          SS.game.start();
        } else {
          SS.msg('That saved run could not be loaded.');
          await main.titleScreen();
        }
        return;
      case 'new': await main.newRun(false); return;
      case 'random': await main.newRun(true); return;
      case 'difficulty': await main.chooseDifficulty(); await main.titleScreen(); return;
      case 'import': {
        var ok = await SS.save.importFromFile();
        if (ok) {
          SS.radar.revealAround(SS.game.sector, SS.game.player.x, SS.game.player.y, 24);
          SS.msg('Run restored.');
          SS.game.start();
        } else {
          await SS.hud.showText([{ text: '  That file could not be read as a 5Space run.' }],
            'Import failed');
          await main.titleScreen();
        }
        return;
      }
      case 'export': SS.save.exportToFile(); await main.titleScreen(); return;
      case 'scores': await SS.game.showScores(); await main.titleScreen(); return;
      case 'help': await SS.commands.help(); await main.titleScreen(); return;
      default: await main.titleScreen(); return;
    }
  };

  /* ------------------------------------------------------------------ */
  /* picking a hull                                                     */
  /* ------------------------------------------------------------------ */

  /* The mode last chosen, so the title screen can show it and a run can
     default to it. */
  main.storedDifficulty = function () {
    var stored = '';
    try { stored = localStorage.getItem('5space.difficulty') || ''; } catch (e) { /* ignore */ }
    return SS.difficultyByKey(stored).key;
  };

  /* The mode picker, shared by the title screen and the start of a run.
     Returns the chosen key, or null if the player backed out. */
  main.chooseDifficulty = async function () {
    var current = main.storedDifficulty();
    var rows = SS.DIFFICULTY_ORDER.map(function (k) {
      var d = SS.DIFFICULTIES[k];
      return {
        letter: d.code, selectable: true, value: k,
        html: '<span class="shipname"' + (k === current ? ' style="color:#ffd24a"' : '') + '>' +
          SS.hud.escapeHtml(pad(d.name, 9)) + '</span>' +
          '<span class="shipstats">' +
          (d.ships > 1 ? d.ships + ' hulls' : 'one hull, permadeath') +
          (k === current ? '   (current)' : '') + '</span>' +
          '<div class="shipblurb">' + SS.hud.escapeHtml(d.blurb) + '</div>' +
          '<div class="shiphint">' + SS.hud.escapeHtml(d.hint) + '</div>'
      };
    });
    var sel = await SS.hud.menu('Choose a difficulty', rows, {
      full: true, footerText: '(Choose with a letter, Esc to go back)'
    });
    if (!sel || !sel.length) return null;
    try { localStorage.setItem('5space.difficulty', sel[0]); } catch (e) { /* ignore */ }
    return sel[0];
  };

  main.newRun = async function (randomize) {
    var stored = '';
    try { stored = localStorage.getItem('5space.name') || ''; } catch (e) { /* ignore */ }

    /* Difficulty comes first.  It is the most consequential choice in the
       run - it decides whether dying ends it - and asking it third, behind a
       name prompt, made it easy to miss entirely.  Both new-run paths ask;
       "random hull" randomises the hull, not the rules. */
    var difficulty = await main.chooseDifficulty();
    if (difficulty === null) { await main.titleScreen(); return; }

    var name = null;
    if (!randomize) {
      name = await SS.hud.getLine('Pilot name (Enter for "' + (stored || 'Pilot') + '")', 20);
      if (name === null) { await main.titleScreen(); return; }
    }
    if (!name) name = stored || 'Pilot';
    try { localStorage.setItem('5space.name', name); } catch (e) { /* ignore */ }

    var keys = SS.shipList();
    var shipKey;

    if (randomize) {
      shipKey = SS.pick(keys);
    } else {
      var rows = [];
      keys.forEach(function (k) {
        var d = SS.SHIPS[k];
        var s = d.settings;
        rows.push({
          letter: d.code, selectable: true, value: k,
          html: '<span class="shipname" style="color:' + d.color + '">' +
            SS.hud.escapeHtml(pad(d.name, 11)) + '</span>' +
            '<span class="shipstats">' +
            'energy ' + pad(s.InitialEnergy + '-' + s.MaximumEnergy, 10) +
            ' guns L' + s.MaximumGuns +
            '  bombs ' + (s.MaximumBombs ? 'L' + s.MaximumBombs : '-') +
            '</span><div class="shipblurb">' + SS.hud.escapeHtml(d.blurb) + '</div>' +
            '<div class="shiphint">' + SS.hud.escapeHtml(d.hint) + '</div>'
        });
      });
      rows.push({ letter: '*', selectable: true, value: '__random', text: 'Pick a hull at random' });

      var sel = await SS.hud.menu(
        'Choosing a hull for ' + name + '  -  ' + SS.DIFFICULTIES[difficulty].name,
        rows, { full: true, footerText: '(Choose with a letter, Esc to go back)' });
      if (!sel || !sel.length) { await main.titleScreen(); return; }
      shipKey = sel[0] === '__random' ? SS.pick(keys) : sel[0];
    }

    SS.game.newGame({ name: name, shipKey: shipKey, difficulty: difficulty });
    SS.save.saveGame();
    SS.game.start();
  };

  function pad(s, n) {
    s = String(s);
    while (s.length < n) s += ' ';
    return s;
  }

  /* ------------------------------------------------------------------ */
  /* entry point                                                        */
  /* ------------------------------------------------------------------ */

  main.init = function () {
    SS.hud.init();
    SS.render.init();
    SS.input.init();
    SS.hud.setupTouch();

    window.addEventListener('beforeunload', function () {
      if (SS.game.started && !SS.game.over) SS.save.saveGame();
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && SS.game.started && !SS.game.over) SS.save.saveGame();
    });

    main.titleScreen();
  };

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', main.init);
    } else {
      main.init();
    }
  }

})(typeof window !== 'undefined' ? (window.SS = window.SS || {}) : (global.SS = global.SS || {}));

</script>
</body>
</html>

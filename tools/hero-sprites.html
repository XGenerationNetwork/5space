<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>hero sprite sheet generator</title></head>
<body style="background:#05060a">
<script src="../js/rng.js"></script>
<script src="../js/data/ships.js"></script>
<script src="../js/data/prizes.js"></script>
<script src="../js/data/enemies.js"></script>
<script src="../js/sector.js"></script>
<script src="../js/sprites.js"></script>
<script>
(function (SS) {
  'use strict';
  SS.sprites.init();

  /* One 4x2 grid of 128px cells.  The art is the game's own - generated by
     js/sprites.js at 2x and copied out - so the hero cannot drift into
     showing ships the game does not have. */
  var CELL = 128, COLS = 4, ROWS = 2;
  var SHIP_PX = SS.sprites.SHIP_PX;

  var sheet = document.createElement('canvas');
  sheet.width = CELL * COLS; sheet.height = CELL * ROWS;
  var g = sheet.getContext('2d');
  g.imageSmoothingEnabled = false;

  function cell(i) { return { x: (i % COLS) * CELL, y: Math.floor(i / COLS) * CELL }; }

  /* Rotation 30 of 40 is a quarter turn anticlockwise from "up", i.e. nose
     left - the way something drifting right-to-left across the screen faces. */
  var FACING = 30;
  var SHIPS = ['warbird', 'javelin', 'leviathan', 'weasel', 'spider', 'terrier'];

  SHIPS.forEach(function (key, i) {
    var src = SS.sprites.shipSheet(key, SS.SHIPS[key].color);
    var c = cell(i);
    g.drawImage(src, FACING * SHIP_PX, 0, SHIP_PX, SHIP_PX,
                c.x, c.y, CELL, CELL);
  });

  function centred(img, i) {
    var c = cell(i);
    var s = Math.min(CELL / img.width, CELL / img.height) * 0.9;
    var w = img.width * s, h = img.height * s;
    g.drawImage(img, c.x + (CELL - w) / 2, c.y + (CELL - h) / 2, w, h);
  }
  centred(SS.sprites.flag(), 6);
  centred(SS.sprites.green(), 7);

  document.body.appendChild(sheet);
  window.SHEET = sheet;

  /* The masthead loads the data: URI, not the .png - see the header of
     shots/hero-sprites.js for why.  Both come from this one canvas so they
     cannot drift, and the deploy stage asserts they still match. */
  window.dataURI = function () { return sheet.toDataURL('image/png'); };

  var note = document.createElement('p');
  note.style.cssText = 'color:#9fb4cc;font:13px/1.6 monospace;max-width:64ch';
  note.textContent = 'To regenerate: run dataURI() in the console and write the '
    + 'result into shots/hero-sprites.js as window.HERO_SHEET, then save this '
    + 'canvas as shots/hero-sprites.png. The deploy test fails if they differ.';
  document.body.appendChild(note);

  window.READY = true;
}(window.SS));
</script>
</body>
</html>
